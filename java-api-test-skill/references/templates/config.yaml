# Java API测试自动化工具 - 配置文件
# 
# 使用方式：
# 1. 在你的项目目录创建 api_test_config.yaml，覆盖默认配置
# 2. 或使用环境变量：API_BASE_URL, API_HEADERS, API_TIMEOUT
# 3. 或使用命令行参数：--base-url, --header
# 
# 配置优先级（从高到低）：
#   1. 命令行参数
#   2. 环境变量
#   3. 工作目录的 api_test_config.yaml
#   4. 此默认配置文件

api:
  base_url: http://localhost:8080
  timeout: 30
  default_headers:
    Content-Type: application/json
    Accept: application/json

test:
  output_dir: ./output/reports
  report_format: html

incremental:
  enabled: true
  git_path: ./
  base_branch: main

logging:
  level: INFO
  format: "%(asctime)s - %(levelname)s - %(message)s"